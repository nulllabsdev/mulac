name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev, feat/gtd]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target

      - name: Format check
        run:  make fmt

      - name: Check workspace
        run: make check

      # Library crates only (kernel + libs). The DB-backed test apps run in
      # their own workflows (test-app-todo.yml, test-app-twitter.yml).
      - name: Test libraries
        run: make test-libs
