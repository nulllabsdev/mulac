name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev, feat/gtd]

jobs:
  test:
    runs-on: ubuntu-latest

    # `make test` runs the test_apps (todo, twitter) which need a live
    # Postgres. Mirror test_apps/docker-compose.yml: superuser postgres,
    # exposed on host port 5433 (the port baked into each app's .env).
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            test_apps -> target

      - name: Seed test_app databases
        run: psql "postgres://postgres:postgres@127.0.0.1:5433/postgres" -v ON_ERROR_STOP=1 -f test_apps/init.sql

      - name: Format check
        run:  make fmt

      - name: Check workspace
        run: make check

      - name: Test workspace
        run: make test
